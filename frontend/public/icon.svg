<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#00080f"/>
  <!-- Outer glow -->
  <circle cx="256" cy="256" r="225" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.25"/>
  <!-- Radar rings -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
  <circle cx="256" cy="256" r="125" fill="none" stroke="#00d4ff" stroke-width="2"   opacity="0.5"/>
  <circle cx="256" cy="256" r="75"  fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.65"/>
  <!-- Crosshairs -->
  <line x1="256" y1="31"  x2="256" y2="481" stroke="#00d4ff" stroke-width="1" opacity="0.18"/>
  <line x1="31"  y1="256" x2="481" y2="256" stroke="#00d4ff" stroke-width="1" opacity="0.18"/>
  <!-- Radar sweep fill -->
  <path d="M256,256 L256,81 A175,175 0 0,1 422,331 Z" fill="#00d4ff" opacity="0.09"/>
  <path d="M256,256 L256,81 A175,175 0 0,1 422,331 Z" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.3"/>
  <!-- Threat dot (red) -->
  <circle cx="330" cy="190" r="12" fill="#ff2244" opacity="0.9"/>
  <circle cx="330" cy="190" r="20" fill="none" stroke="#ff2244" stroke-width="1.5" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="10" fill="#00d4ff"/>
  <circle cx="256" cy="256" r="4"  fill="#00080f"/>
  <!-- Top-left corner bracket -->
  <path d="M40,40 L40,80 M40,40 L80,40" stroke="#00d4ff" stroke-width="3" fill="none" opacity="0.7"/>
  <!-- Bottom-right corner bracket -->
  <path d="M472,472 L472,432 M472,472 L432,472" stroke="#00d4ff" stroke-width="3" fill="none" opacity="0.7"/>
</svg>
